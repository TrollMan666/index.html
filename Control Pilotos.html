<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Pedidos y Rutas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .milestone-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 font-sans">

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 space-y-6">
        
        <header class="text-center">
            <h1 class="text-2xl font-bold text-gray-800">Registro de Pilotos</h1>
            <p class="text-sm text-gray-500">Monitoreo de ruta y entregas</p>
        </header>

        <!-- GPS en tiempo real -->
        <div id="gps-status" class="bg-yellow-50 border border-yellow-200 text-yellow-800 p-3 rounded-lg text-sm flex items-center justify-between">
            <span>📍 GPS: Desactivado</span>
            <button onclick="toggleGPS()" id="btn-gps" class="bg-yellow-600 text-white px-3 py-1 rounded text-xs font-semibold uppercase tracking-wider cursor-pointer">Activar</button>
        </div>

        <!-- Coordenadas en vivo -->
        <div id="live-location" class="hidden text-xs text-gray-600 bg-gray-50 p-2 rounded border border-gray-200">
            <strong>Ubicación actual:</strong> <span id="current-coords">Obteniendo...</span>
        </div>

        <!-- FORMULARIO PRINCIPAL -->
        <form id="orderForm" onsubmit="enviarDatos(event)" class="space-y-4">

            <div>
                <label class="block text-sm font-medium text-gray-700">Nombre y Apellido</label>
                <input type="text" id="nombre" required class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm p-2 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Número de Placa</label>
                <input type="text" id="placa" required class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm p-2 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Hora de Asignación de Pedido</label>
                <input type="time" id="hora-asignacion" required class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm p-2 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Número de Pedido</label>
                <input type="text" id="pedido" required class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm p-2 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <hr class="border-gray-200 my-4">

            <!-- Control de Tiempos e Hitos -->
            <div class="space-y-3">
                <h3 class="text-sm font-semibold text-gray-700 uppercase tracking-wider">Control de Tiempos y Ubicación</h3>

                <!-- 1. Inicio de Ruta -->
                <div class="flex flex-col p-2 bg-gray-50 rounded-lg border border-gray-200">
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-medium">1. Inicio de Ruta</span>
                        <button type="button" onclick="registrarHito('inicio')" id="btn-inicio" class="milestone-btn bg-blue-600 text-white text-xs px-3 py-1.5 rounded font-medium cursor-pointer">Registrar</button>
                    </div>
                    <div id="log-inicio" class="text-xs text-gray-500 mt-1 hidden"></div>
                </div>

                <!-- 2. Llegada con Cliente -->
                <div class="flex flex-col p-2 bg-gray-50 rounded-lg border border-gray-200">
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-medium">2. Llegada con Cliente</span>
                        <button type="button" onclick="registrarHito('llegada')" id="btn-llegada" class="milestone-btn bg-blue-600 text-white text-xs px-3 py-1.5 rounded font-medium cursor-pointer">Registrar</button>
                    </div>
                    <div id="log-llegada" class="text-xs text-gray-500 mt-1 hidden"></div>
                </div>

                <!-- 3. Finalizado -->
                <div class="flex flex-col p-2 bg-gray-50 rounded-lg border border-gray-200">
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-medium">3. Finalizado</span>
                        <button type="button" onclick="registrarHito('finalizado')" id="btn-finalizado" class="milestone-btn bg-blue-600 text-white text-xs px-3 py-1.5 rounded font-medium cursor-pointer">Registrar</button>
                    </div>
                    <div id="log-finalizado" class="text-xs text-gray-500 mt-1 hidden"></div>

                    <!-- Foto de Entrega -->
                    <div id="foto-container" class="hidden mt-2 p-2 bg-white rounded border border-dashed border-gray-300">
                        <label class="block text-xs font-medium text-gray-600 mb-1">📸 Adjuntar Foto de Entrega (Requerido)</label>
                        <input type="file" id="foto" accept="image/*" capture="environment" onchange="procesarFoto()" class="text-xs w-full">
                        <img id="preview" class="hidden mt-2 w-full h-32 object-cover rounded">
                    </div>
                </div>

                <!-- 4. En Retorno -->
                <div class="flex flex-col p-2 bg-gray-50 rounded-lg border border-gray-200">
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-medium">4. En Retorno</span>
                        <button type="button" onclick="registrarHito('retorno')" id="btn-retorno" class="milestone-btn bg-blue-600 text-white text-xs px-3 py-1.5 rounded font-medium cursor-pointer">Registrar</button>
                    </div>
                    <div id="log-retorno" class="text-xs text-gray-500 mt-1 hidden"></div>
                </div>
            </div>

            <!-- Botón Enviar -->
            <button type="submit" id="btn-submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 mt-6 shadow cursor-pointer">
                Enviar Reporte Final
            </button>
        </form>

        <!-- PANTALLA DE ÉXITO -->
        <div id="success-screen" class="hidden text-center py-8 space-y-6">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 text-green-600 rounded-full text-3xl mx-auto font-bold">✓</div>
            <div>
                <h2 class="text-xl font-bold text-gray-800">¡Reporte Enviado!</h2>
                <p class="text-sm text-gray-500 mt-1">Los datos y la foto se guardaron correctamente.</p>
            </div>
            <button onclick="nuevoRegistro()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow cursor-pointer">
                🔄 Registrar Otro Pedido
            </button>
        </div>

    </div>

    <script>
        /*
        ══════════════════════════════════════════════════════════════
        CÓDIGO ACTUALIZADO PARA TU GOOGLE APPS SCRIPT
        (Reemplaza TODO el contenido actual de tu script con esto)
        ══════════════════════════════════════════════════════════════

        const FOLDER_ID = "1JpRW5sc8NWfQuKiZ2kX03ha0PFb5mGLJ";

        function doPost(e) {
          try {
            const data = JSON.parse(e.postData.contents);
            const sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();

            if (sheet.getLastRow() === 0) {
              sheet.appendRow([
                "Nombre", "Placa", "Hora Asignación", "Pedido",
                "Inicio Hora", "Inicio Coords",
                "Llegada Hora", "Llegada Coords",
                "Finalizado Hora", "Finalizado Coords",
                "Retorno Hora", "Retorno Coords", "Foto"
              ]);
            }

            let fotoLink = "Sin foto";
            if (data.cronologia.finalizado.fotoBase64) {
              fotoLink = guardarFotoEnDrive(data.cronologia.finalizado.fotoBase64, data.pedido);
            }

            const c = data.cronologia;
            sheet.appendRow([
              data.nombre,
              data.placa,
              data.horaAsignacion,
              data.pedido,
              c.inicio.hora,      c.inicio.coords,
              c.llegada.hora,     c.llegada.coords,
              c.finalizado.hora,  c.finalizado.coords,
              c.retorno.hora,     c.retorno.coords,
              fotoLink
            ]);

            return ContentService.createTextOutput(JSON.stringify({ status: "success" }))
              .setMimeType(ContentService.MimeType.JSON);

          } catch(err) {
            return ContentService.createTextOutput(JSON.stringify({ status: "error", message: err.toString() }))
              .setMimeType(ContentService.MimeType.JSON);
          }
        }

        function guardarFotoEnDrive(base64String, numeroPedido) {
          const partes = base64String.split(",");
          const tipo   = partes[0].match(/:(.*?);/)[1];
          const datos  = Utilities.base64Decode(partes[1]);
          const blob   = Utilities.newBlob(datos, tipo, "entrega_" + numeroPedido + "_" + Date.now() + ".jpg");
          const carpeta = DriveApp.getFolderById(FOLDER_ID);
          const archivo = carpeta.createFile(blob);
          archivo.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);
          return archivo.getUrl();
        }

        ══════════════════════════════════════════════════════════════
        PASOS DESPUÉS DE PEGAR EL CÓDIGO:
        1. Guardar (Ctrl+S)
        2. Implementar → Administrar implementaciones → editar (lápiz)
           → Nueva versión → Implementar
        3. La primera vez pedirá permisos para Drive → Aceptar
        ══════════════════════════════════════════════════════════════
        */

        let datosRuta = {
            inicio:     { hora: null, coords: null },
            llegada:    { hora: null, coords: null },
            finalizado: { hora: null, coords: null, fotoBase64: null },
            retorno:    { hora: null, coords: null }
        };

        let watchId = null;
        let currentCoordsString = "No disponible";

        function toggleGPS() {
            const statusDiv = document.getElementById('gps-status');
            const liveDiv   = document.getElementById('live-location');
            const btn       = document.getElementById('btn-gps');

            if (watchId === null) {
                if (!navigator.geolocation) {
                    alert("Tu navegador no soporta Geo-localización.");
                    return;
                }
                btn.innerText = "Apagar";
                statusDiv.className = "bg-green-50 border border-green-200 text-green-800 p-3 rounded-lg text-sm flex items-center justify-between";
                statusDiv.querySelector('span').innerText = "📍 GPS: Monitoreando en vivo";
                liveDiv.classList.remove('hidden');

                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(6);
                        const lon = position.coords.longitude.toFixed(6);
                        currentCoordsString = lat + ", " + lon;
                        document.getElementById('current-coords').innerText = currentCoordsString;
                    },
                    (error) => {
                        console.error(error);
                        document.getElementById('current-coords').innerText = "Error al obtener ubicación.";
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                btn.innerText = "Activar";
                statusDiv.className = "bg-yellow-50 border border-yellow-200 text-yellow-800 p-3 rounded-lg text-sm flex items-center justify-between";
                statusDiv.querySelector('span').innerText = "📍 GPS: Desactivado";
                liveDiv.classList.add('hidden');
                currentCoordsString = "No disponible";
            }
        }

        function registrarHito(tipo) {
            if (!watchId && currentCoordsString === "No disponible") {
                alert("Por favor, activa el GPS arriba antes de registrar tiempos.");
                return;
            }

            const ahora      = new Date();
            const horaString = ahora.toLocaleDateString() + ' ' + ahora.toLocaleTimeString();

            datosRuta[tipo].hora   = horaString;
            datosRuta[tipo].coords = currentCoordsString;

            const logBox = document.getElementById("log-" + tipo);
            logBox.innerHTML = "🕒 <strong>Hora:</strong> " + horaString + " <br> 📍 <strong>Ubicación:</strong> " + currentCoordsString;
            logBox.classList.remove('hidden');

            const btn = document.getElementById("btn-" + tipo);
            btn.disabled  = true;
            btn.className = "milestone-btn bg-gray-400 text-white text-xs px-3 py-1.5 rounded font-medium";

            if (tipo === 'finalizado') {
                document.getElementById('foto-container').classList.remove('hidden');
            }
        }

        function procesarFoto() {
            const file   = document.getElementById('foto').files[0];
            const reader = new FileReader();

            reader.onloadend = function() {
                datosRuta.finalizado.fotoBase64 = reader.result;
                const preview = document.getElementById('preview');
                preview.src   = reader.result;
                preview.classList.remove('hidden');
            };

            if (file) {
                reader.readAsDataURL(file);
            }
        }

        async function enviarDatos(event) {
            event.preventDefault();

            if (datosRuta.finalizado.hora && !datosRuta.finalizado.fotoBase64) {
                alert("Por favor, capture o suba la foto de la entrega finalizada.");
                return;
            }

            const submitBtn      = document.getElementById('btn-submit');
            submitBtn.disabled   = true;
            submitBtn.innerText  = "Enviando...";

            const payload = {
                nombre:         document.getElementById('nombre').value,
                placa:          document.getElementById('placa').value,
                horaAsignacion: document.getElementById('hora-asignacion').value,
                pedido:         document.getElementById('pedido').value,
                cronologia:     datosRuta
            };

            const URL_WEBHOOK = "https://script.google.com/macros/s/AKfycbxaqwibtF7w3sFiJN4OwpRusB1EoAKlVrZAjzPvEbZfa1EEQk8RWnnvJ52DMKENhCJ3/exec";

            try {
                await fetch(URL_WEBHOOK, {
                    method:  "POST",
                    mode:    "no-cors",
                    headers: { "Content-Type": "text/plain" },
                    body:    JSON.stringify(payload)
                });

                document.getElementById('orderForm').classList.add('hidden');
                document.getElementById('success-screen').classList.remove('hidden');

            } catch (err) {
                console.error(err);
                submitBtn.disabled  = false;
                submitBtn.innerText = "Enviar Reporte Final";
                alert("Error de red al enviar. Verifica tu conexión e intenta de nuevo.");
            }
        }

        function nuevoRegistro() {
            document.getElementById('orderForm').reset();

            datosRuta = {
                inicio:     { hora: null, coords: null },
                llegada:    { hora: null, coords: null },
                finalizado: { hora: null, coords: null, fotoBase64: null },
                retorno:    { hora: null, coords: null }
            };

            ['inicio', 'llegada', 'finalizado', 'retorno'].forEach(tipo => {
                const btn     = document.getElementById("btn-" + tipo);
                btn.disabled  = false;
                btn.className = "milestone-btn bg-blue-600 text-white text-xs px-3 py-1.5 rounded font-medium cursor-pointer";

                const logBox = document.getElementById("log-" + tipo);
                logBox.innerHTML = "";
                logBox.classList.add('hidden');
            });

            document.getElementById('foto-container').classList.add('hidden');
            const preview = document.getElementById('preview');
            preview.src   = "";
            preview.classList.add('hidden');

            const submitBtn     = document.getElementById('btn-submit');
            submitBtn.disabled  = false;
            submitBtn.innerText = "Enviar Reporte Final";

            document.getElementById('success-screen').classList.add('hidden');
            document.getElementById('orderForm').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
